# Builds the GPU image (Studio + ComfyUI + ai-toolkit, see Dockerfile.gpu) and
# pushes it to GHCR so a RunPod pod can pull it — RunPod only pulls images, it
# cannot build from this Dockerfile itself. Scoped to a branch rather than main:
# this is a fork-local addition (ai-toolkit baked in for local LoRA training) that
# upstream does not ship, so it stays off main until/unless that changes.
name: build-gpu-image

on:
  push:
    branches: [runpod-aitoolkit]
    paths:
      - Dockerfile.gpu
      - backend/requirements.txt
      - backend/requirements-ml.txt
      - .github/workflows/build-gpu-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stock GitHub-hosted runner has ~14GB free, and this image (GPU base +
      # ComfyUI + torch twice over, once cu129 for the Studio and once cu130 for
      # ai-toolkit) measured well over that uncompressed. Strip preinstalled
      # toolchains this build never uses before BuildKit needs the space.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lora-dataset-studio-gpu:latest
            ghcr.io/${{ github.repository_owner }}/lora-dataset-studio-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
